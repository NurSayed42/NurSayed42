<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-label="Layered system: 01 Frontend (React, Next.js), 02 Backend (Spring Boot, Django, FastAPI), 03 Database (PostgreSQL, Redis), 04 AI (LLMs, RAG, agents), 05 Automation (workers, queues, workflows).">
<title>Layered system: 01 Frontend (React, Next.js), 02 Backend (Spring Boot, Django, FastAPI), 03 Database (PostgreSQL, Redis), 04 AI (LLMs, RAG, agents), 05 Automation (workers, queues, workflows).</title>
<style>:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0969da;--top:#ffffff;--l:#eef2f6;--r:#e2e8ee;--grid:#d1d9e0;--hl:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#4493f8;--top:#161b22;--l:#10151b;--r:#0c1015;--grid:#30363d;--hl:#12233a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.top{fill:var(--top);stroke:var(--line);stroke-width:1} .sl{fill:var(--l);stroke:var(--line);stroke-width:1} .sr{fill:var(--r);stroke:var(--line);stroke-width:1}
.lbl{fill:var(--fg);font-weight:600} .sub{fill:var(--muted)} .acc{fill:var(--accent)}
.link{stroke:var(--accent);stroke-width:1.3;fill:none;opacity:.55} .faint{stroke:var(--line);stroke-width:1;fill:none}
.dot{fill:var(--accent)}
.draw{animation:draw 1.6s ease-out} @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none}}
</style>
