<svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" viewBox="0 0 64 56" role="img" aria-label="AI engineering"><style>:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0969da;--top:#ffffff;--l:#eef2f6;--r:#e2e8ee;--grid:#d1d9e0;--hl:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#4493f8;--top:#161b22;--l:#10151b;--r:#0c1015;--grid:#30363d;--hl:#12233a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.top{fill:var(--top);stroke:var(--line);stroke-width:1} .sl{fill:var(--l);stroke:var(--line);stroke-width:1} .sr{fill:var(--r);stroke:var(--line);stroke-width:1}
.lbl{fill:var(--fg);font-weight:600} .sub{fill:var(--muted)} .acc{fill:var(--accent)}
.link{stroke:var(--accent);stroke-width:1.3;fill:none;opacity:.55} .faint{stroke:var(--line);stroke-width:1;fill:none}
.dot{fill:var(--accent)}
.draw{animation:draw 1.6s ease-out} @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none}}</style><defs><filter id="sh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#1f2328" flood-opacity=".12"/></filter></defs><g filter="url(#sh)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="6s" begin="-0.0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><polygon class="sl" points="8,26 32,38 32,45 8,33"/><polygon class="sr" points="32,38 56,26 56,33 32,45"/><polygon class="top" points="32,14 56,26 32,38 8,26"/><g class="dot"><circle cx="24" cy="26" r="2"/><circle cx="40" cy="26" r="2"/><circle cx="32" cy="21" r="2"/><circle cx="32" cy="31" r="2"/></g><g style="stroke:var(--accent)" stroke-width="1" opacity=".7"><line x1="24" y1="26" x2="32" y2="21"/><line x1="32" y1="21" x2="40" y2="26"/><line x1="24" y1="26" x2="32" y2="31"/><line x1="32" y1="31" x2="40" y2="26"/></g></g></svg>
