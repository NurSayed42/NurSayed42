<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="Nur Sayed — Lead Engineer at VecoSoft. Full-stack and AI engineering, from frontend to backend, database, AI and automation.">
<title>Nur Sayed — Lead Engineer at VecoSoft</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0969da;--node:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#4493f8;--node:#151b23}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.name{fill:var(--fg);font-size:46px;font-weight:650;letter-spacing:-1px}
.type{fill:var(--accent);font-size:20px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.caret{fill:var(--accent);animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes k0{0%{transform:translateX(0);opacity:1;animation-timing-function:steps(25,end)}
6.5%{transform:translateX(300.0px);opacity:1}
19.5%{transform:translateX(300.0px);opacity:1;animation-timing-function:steps(25,end)}
22.5%{transform:translateX(0);opacity:1}
22.51%,100%{transform:translateX(0);opacity:0}}
.a0{animation:k0 20s linear 0.0s infinite}
g.a0{opacity:0}
@keyframes k1{0%{transform:translateX(0);opacity:1;animation-timing-function:steps(27,end)}
6.5%{transform:translateX(324.0px);opacity:1}
19.5%{transform:translateX(324.0px);opacity:1;animation-timing-function:steps(27,end)}
22.5%{transform:translateX(0);opacity:1}
22.51%,100%{transform:translateX(0);opacity:0}}
.a1{animation:k1 20s linear 5.0s infinite}
g.a1{opacity:0}
@keyframes k2{0%{transform:translateX(0);opacity:1;animation-timing-function:steps(27,end)}
6.5%{transform:translateX(324.0px);opacity:1}
19.5%{transform:translateX(324.0px);opacity:1;animation-timing-function:steps(27,end)}
22.5%{transform:translateX(0);opacity:1}
22.51%,100%{transform:translateX(0);opacity:0}}
.a2{animation:k2 20s linear 10.0s infinite}
g.a2{opacity:0}
@keyframes k3{0%{transform:translateX(0);opacity:1;animation-timing-function:steps(35,end)}
6.5%{transform:translateX(420.0px);opacity:1}
19.5%{transform:translateX(420.0px);opacity:1;animation-timing-function:steps(35,end)}
22.5%{transform:translateX(0);opacity:1}
22.51%,100%{transform:translateX(0);opacity:0}}
.a3{animation:k3 20s linear 15.0s infinite}
g.a3{opacity:0}
rect.a0{transform:translateX(300.0px)}
.track{stroke:var(--line);stroke-width:1.5}
.flow{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 12;opacity:.8;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1.2;animation:glow 12.5s ease-in-out infinite}
.node text{fill:var(--fg);font-size:14px;font-weight:500;text-anchor:middle}
.n2 rect{animation-delay:2.5s}.n3 rect{animation-delay:5s}.n4 rect{animation-delay:7.5s}.n5 rect{animation-delay:10s}
@keyframes glow{0%,100%{stroke:var(--line)}8%,16%{stroke:var(--accent)}26%{stroke:var(--line)}}
@media (prefers-reduced-motion:reduce){
 .caret,.flow,.node rect,.a0,.a1,.a2,.a3{animation:none}
 .a0{transform:translateX(300.0px)} g.a1,g.a2,g.a3,g.a0{opacity:0}
}
</style>
<defs><clipPath id="c0"><rect class="a0" x="-260.0" y="100" width="300.0" height="30"/></clipPath><clipPath id="c1"><rect class="a1" x="-284.0" y="100" width="324.0" height="30"/></clipPath><clipPath id="c2"><rect class="a2" x="-284.0" y="100" width="324.0" height="30"/></clipPath><clipPath id="c3"><rect class="a3" x="-380.0" y="100" width="420.0" height="30"/></clipPath></defs>
<text class="name" x="38" y="72">Nur Sayed</text>
<g><text class="type" x="40" y="122" textLength="300.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#c0)">Lead Engineer at VecoSoft</text><g class="a0"><rect class="caret" x="42" y="104" width="2" height="22" rx="1"/></g><text class="type" x="40" y="122" textLength="324.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#c1)">Full-stack &amp; AI engineering</text><g class="a1"><rect class="caret" x="42" y="104" width="2" height="22" rx="1"/></g><text class="type" x="40" y="122" textLength="324.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#c2)">Building practical products</text><g class="a2"><rect class="caret" x="42" y="104" width="2" height="22" rx="1"/></g><text class="type" x="40" y="122" textLength="420.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#c3)">Turning ideas into working software</text><g class="a3"><rect class="caret" x="42" y="104" width="2" height="22" rx="1"/></g></g>
<g>
<line class="track" x1="100" y1="190" x2="780" y2="190"/><line class="flow" x1="100" y1="190" x2="780" y2="190"/>
<g class="node n1"><rect x="40" y="171" width="120" height="38" rx="9"/><text x="100" y="195">Frontend</text></g>
<g class="node n2"><rect x="210" y="171" width="120" height="38" rx="9"/><text x="270" y="195">Backend</text></g>
<g class="node n3"><rect x="380" y="171" width="120" height="38" rx="9"/><text x="440" y="195">Database</text></g>
<g class="node n4"><rect x="550" y="171" width="120" height="38" rx="9"/><text x="610" y="195">AI</text></g>
<g class="node n5"><rect x="720" y="171" width="120" height="38" rx="9"/><text x="780" y="195">Automation</text></g>
</g>
</svg>
