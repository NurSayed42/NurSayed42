<svg xmlns="http://www.w3.org/2000/svg" width="880" height="16" viewBox="0 0 880 16" role="img" aria-label="Section divider">
<style>
:root{--line:#d1d9e0;--accent:#0969da}
@media (prefers-color-scheme:dark){:root{--line:#3d444d;--accent:#4493f8}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-180px)}60%,100%{transform:translateX(880px)}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--accent);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
<rect x="0" y="7.5" width="880" height="1" style="fill:var(--line)"/>
<rect class="sweep" x="0" y="7" width="180" height="2" rx="1" fill="url(#g)"/>
</svg>
